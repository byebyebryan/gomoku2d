name: Deploy to GitHub Pages

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build with the selected workflow
        type: string
      expected_sha:
        description: Full commit SHA required when a release tag is supplied
        type: string

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: gomoku-web/package-lock.json

      - name: Validate release tag, package version, and changelog
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          DISPATCHED_RELEASE: ${{ inputs.release_tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          SOURCE_SHA=$(git rev-parse HEAD)
          if [[ -n "$DISPATCHED_RELEASE" && "$SOURCE_SHA" != "$EXPECTED_SHA" ]]; then
            echo "::error::Tagged source does not match expected_sha."
            exit 1
          fi
          node scripts/validate_release_ref.mjs "$RELEASE_TAG"
          echo "Release source: $RELEASE_TAG at $SOURCE_SHA"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            gomoku-bot-lab/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install wasm-pack
        run: |
          bash scripts/install-ci-wasm-pack.sh "$RUNNER_TEMP/gomoku-bin"
          echo "$RUNNER_TEMP/gomoku-bin" >> "$GITHUB_PATH"

      - name: Build WASM package
        run: wasm-pack build gomoku-bot-lab/gomoku-wasm --target bundler -- --locked

      - name: Install npm dependencies
        run: npm ci
        working-directory: gomoku-web
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Build
        run: npm run build
        working-directory: gomoku-web
        env:
          GOMOKU_BASE_PATH: /
          VITE_FIREBASE_API_KEY: AIzaSyAGB97sL0GRf_x4IyzTaA-lo4fq5XoXWfw
          VITE_FIREBASE_APP_ID: 1:892554744656:web:17524b73c8afb856841255
          VITE_FIREBASE_AUTH_DOMAIN: gomoku2d.firebaseapp.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: '892554744656'
          VITE_FIREBASE_PROJECT_ID: gomoku2d
          VITE_FIREBASE_STORAGE_BUCKET: gomoku2d.firebasestorage.app

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: gomoku-web/dist

      - name: Wait for Pages artifact availability
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          for ((attempt = 1; attempt <= 12; attempt++)); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT_NAME" |
              jq -e --arg id "$ARTIFACT_ID" '
                .artifacts | length == 1 and
                (.[0].id | tostring) == $id and .[0].expired == false
              ' >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Pages artifact $ARTIFACT_ID did not become available."
          exit 1

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
