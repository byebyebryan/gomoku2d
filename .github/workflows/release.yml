name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Validate release tag, package version, and changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node scripts/validate_release_ref.mjs "$RELEASE_TAG"

      - name: Build release title and body
        id: meta
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          # Extract the literal version section (prerelease/build metadata may
          # contain regular-expression characters such as dots and plus signs).
          BODY=$(awk -v v="$VERSION" '
            index($0, "## [" v "] - ") == 1 {flag=1; next}
            /^\[[^]]+\]: / && flag {exit}
            /^## \[/ {flag=0}
            flag {print}
          ' CHANGELOG.md)

          if [ -z "$BODY" ]; then
            echo "::error::No CHANGELOG section found for [${VERSION}]"
            exit 1
          fi

          # Extract Theme block (may span multiple lines); join into one line,
          # then strip the **Theme: ... ** wrapper, trailing period, backticks.
          THEME=$(printf '%s\n' "$BODY" | awk '
              /^\*\*Theme:/ {grab=1}
              grab {print}
              grab && /\*\*$/ {exit}
            ' | tr '\n' ' ' \
            | sed -E 's/^\*\*Theme: ?//; s/ ?\*\*.*$//; s/\.$//; s/`//g; s/[[:space:]]+$//')

          # Shorten title at first em-dash or comma
          THEME_SHORT=$(printf '%s' "$THEME" | sed -E 's/ ?[—,].*//')

          if [ -n "$THEME_SHORT" ]; then
            TITLE="${TAG} — ${THEME_SHORT}"
          else
            TITLE="${TAG}"
          fi

          VERSION_CORE="${VERSION%%+*}"
          if [[ "$VERSION_CORE" == *-* ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi

          {
            echo "**Play this build:** https://gomoku2d.byebyebryan.com/"
            echo
            printf '%s\n' "$BODY"
            echo
            echo "---"
            echo
            echo "Full changelog: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)"
          } > release_body.md

          # Expose title via step output (multi-line safe)
          {
            echo "title<<__EOF__"
            printf '%s\n' "$TITLE"
            echo "__EOF__"
            echo "prerelease=${PRERELEASE}"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.meta.outputs.title }}
          body_path: release_body.md
          draft: false
          prerelease: ${{ steps.meta.outputs.prerelease }}
